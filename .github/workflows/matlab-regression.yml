name: MATLAB regression — seven UAV modules

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab:
    name: Baseline and Advanced V2 tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
      - name: Baseline MATLAB integration tests
        uses: matlab-actions/run-command@v3
        with:
          command: "run('tests/run_tests.m'); run('tests/run_verification_campaign_tests.m'); run('tests/run_mission_lifecycle_tests.m')"
      - name: New seven-module Advanced V2 tests
        uses: matlab-actions/run-command@v3
        with:
          command: "run('tests/run_advanced_tests.m'); run('tests/run_advanced_campaign_tests.m')"
